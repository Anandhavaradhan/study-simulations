<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of Elements</title>
<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --paper: #F6F6F2;
    --paper-card: #FFFFFF;
    --line: #DEDCD1;
    --amber: #E3A23C;
    --amber-deep: #8A5A16;
    --amber-bg: #FBE8C8;
    --amber-line: #C98A2E;
    --teal: #1F6F78;
    --teal-deep: #123F44;
    --shadow: rgba(20, 20, 18, 0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #EDEBE3;
      --ink-soft: #A9A79D;
      --paper: #17181A;
      --paper-card: #212326;
      --line: #34363A;
      --amber-bg: #4A3A17;
      --amber-line: #C98A2E;
      --teal: #4FB8B0;
      --teal-deep: #8FD8D2;
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 1320px; margin: 0 auto; padding: 40px 24px 60px; }
  .page-header { margin-bottom: 24px; }
  h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 16px;
  }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--paper-card); border: 1.5px solid var(--line); display: inline-block; }
  .swatch.hi { background: var(--amber-bg); border-color: var(--amber-line); }

  .table-scroll { overflow-x: auto; padding-bottom: 8px; }
  .grid {
    display: grid;
    grid-template-columns: 46px repeat(18, 64px);
    grid-template-rows: 30px repeat(7, 78px) 18px repeat(2, 78px);
    gap: 3px;
    width: max-content;
  }
  .rowlabel, .gnum {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .cell {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 5px 6px 6px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--paper-card);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    color: var(--ink);
  }
  .cell:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px var(--shadow);
    border-color: var(--teal);
  }
  .cell:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
  .cell.hi { background: var(--amber-bg); border-color: var(--amber-line); }
  .cell .z { font-size: 10px; font-weight: 600; color: var(--ink-soft); }
  .cell .sym { font-size: 20px; font-weight: 800; line-height: 1; align-self: center; }
  .cell .mass { font-size: 9px; color: var(--ink-soft); align-self: flex-end; }

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 14, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 1000;
  }
  .detail-overlay.open { opacity: 1; pointer-events: auto; }
  .detail-card {
    background: var(--paper-card);
    border-radius: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 86vh;
    overflow-y: auto;
    box-shadow: 0 30px 70px var(--shadow);
    transform: scale(0.82) translateY(16px);
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
    position: relative;
  }
  .detail-overlay.open .detail-card { transform: scale(1) translateY(0); }
  .close-btn {
    position: absolute;
    top: 14px; right: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.08);
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }
  .close-btn:hover { background: rgba(0,0,0,0.16); }
  .card-band {
    background: var(--teal-deep);
    color: #F4F3ED;
    padding: 34px 28px 22px;
    border-radius: 18px 18px 0 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .card-band.hi { background: var(--amber-deep); }
  .card-z { font-size: 18px; font-weight: 600; opacity: 0.85; }
  .card-symbol { font-size: 56px; font-weight: 800; letter-spacing: -0.01em; }
  .card-body { padding: 24px 28px 30px; }
  .card-body h2 { margin: 0 0 10px; font-size: 24px; font-weight: 700; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--amber-deep);
    background: var(--amber-bg);
    border: 1px solid var(--amber-line);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .stat-row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 100px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat-label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .stat-value { display: block; font-size: 16px; font-weight: 700; }
  .origin-block h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .origin-block p { margin: 0; font-size: 15px; line-height: 1.55; }

  @media (max-width: 640px) {
    h1 { font-size: 26px; }
    .card-symbol { font-size: 44px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Periodic Table of Elements</h1>
      <p class="subtitle">Click any element to see its full name, atomic mass, group, period, and symbol origin.</p>
      <div class="legend">
        <span class="legend-item"><span class="swatch hi"></span>Key exam elements</span>
        <span class="legend-item"><span class="swatch"></span>Other elements</span>
      </div>
    </header>

    <div class="table-scroll">
      <div id="grid" class="grid"></div>
    </div>
  </div>

  <div id="overlay" class="detail-overlay">
    <div id="card" class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-name">
      <button id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
      <div id="cardBand" class="card-band">
        <div class="card-z" id="detail-z"></div>
        <div class="card-symbol" id="detail-symbol"></div>
      </div>
      <div class="card-body">
        <h2 id="detail-name"></h2>
        <div id="detail-badge" class="badge" style="display:none;">Frequently tested</div>
        <div class="stat-row">
          <div class="stat"><span class="stat-label">Atomic mass</span><span class="stat-value" id="detail-mass"></span></div>
          <div class="stat"><span class="stat-label">Period</span><span class="stat-value" id="detail-period"></span></div>
          <div class="stat"><span class="stat-label">Group</span><span class="stat-value" id="detail-group"></span></div>
        </div>
        <div class="origin-block">
          <h3>Symbol / name origin</h3>
          <p id="detail-origin"></p>
        </div>
      </div>
    </div>
  </div>

<script>
const ELEMENTS = [
[1,"H","Hydrogen","main",1,1,"1.00","Greek hydro (water) + genes (forming) - water forming"],

[5,"B","Boron","main",2,13,"11.00","Arabic/Persian buraq - from the mineral borax"],
[6,"C","Carbon","main",2,14,"12.00","Latin carbo - coal / charcoal"],
[7,"N","Nitrogen","main",2,15,"14.00","Greek nitron + genes - niter forming"],
[8,"O","Oxygen","main",2,16,"16.00","Greek oxys + genes - acid forming"],

[42,"Mo","Molybdenum","main",5,6,"96.00","Greek molybdos - lead (was confused with lead ore)"],
[43,"Tc","Technetium","main",5,7,"[98]","Greek technetos - artificial (first man-made element)"],
[44,"Ru","Ruthenium","main",5,8,"101.00","Latin Ruthenia - the Latin name for Russia"],
[45,"Rh","Rhodium","main",5,9,"103.00","Greek rhodon - rose (colour of its salts)"],
[46,"Pd","Palladium","main",5,10,"106.5","Named after the asteroid Pallas"],
[47,"Ag","Silver","main",5,11,"108.00","Latin argentum"],
[48,"Cd","Cadmium","main",5,12,"112.5","Latin cadmia - old name for calamine ore"],
[49,"In","Indium","main",5,13,"115.00","Latin indicum - indigo, colour of its spectral line"],
[50,"Sn","Tin","main",5,14,"118.5","Latin stannum"],
[51,"Sb","Antimony","main",5,15,"122.00","Latin stibium"],
[52,"Te","Tellurium","main",5,16,"127.5","Latin tellus - earth"],
[53,"I","Iodine","main",5,17,"127.00","Greek iodes - violet coloured"],
[54,"Xe","Xenon","main",5,18,"131.5","Greek xenos - stranger"],
[55,"Cs","Cesium","main",6,1,"133.00","Latin caesius - sky blue (its spectral line)"],
[56,"Ba","Barium","main",6,2,"137.5","Greek barys - heavy"],
[57,"La","Lanthanum","main",6,3,"139.00","Greek lanthanein - to lie hidden"],
[58,"Ce","Cerium","lan",6,null,"140.00","Named after the dwarf planet/asteroid Ceres"],
[59,"Pr","Praseodymium","lan",6,null,"141.00","Greek prasios + didymos - green twin"],
[60,"Nd","Neodymium","lan",6,null,"144.00","Greek neos + didymos - new twin"],
[61,"Pm","Promethium","lan",6,null,"[145]","Named after Prometheus of Greek mythology"],
[62,"Sm","Samarium","lan",6,null,"150.5","Named after the mineral samarskite, honouring V. Samarsky"],
[63,"Eu","Europium","lan",6,null,"152.00","Named after the continent Europe"],
[64,"Gd","Gadolinium","lan",6,null,"157.5","Named after chemist Johan Gadolin"],
[65,"Tb","Terbium","lan",6,null,"159.00","Named after Ytterby, a village in Sweden"],
[66,"Dy","Dysprosium","lan",6,null,"162.5","Greek dysprositos - hard to get"],
[67,"Ho","Holmium","lan",6,null,"165.00","Latin Holmia - the Latin name for Stockholm"],
[68,"Er","Erbium","lan",6,null,"167.5","Named after Ytterby, a village in Sweden"],
[69,"Tm","Thulium","lan",6,null,"169.00","Named after Thule, a mythical northern land"],
[70,"Yb","Ytterbium","lan",6,null,"173.00","Named after Ytterby, a village in Sweden"],
[71,"Lu","Lutetium","lan",6,null,"175.00","Latin Lutetia - the Latin name for Paris"],
[72,"Hf","Hafnium","main",6,4,"178.5","Latin Hafnia - the Latin name for Copenhagen"],
[73,"Ta","Tantalum","main",6,5,"181.00","Named after Tantalus of Greek mythology"],
[74,"W","Tungsten","main",6,6,"184.00","German/Swedish Wolfram - meaning heavy stone"],
[75,"Re","Rhenium","main",6,7,"186.00","Latin Rhenus - the Latin name for the river Rhine"],
[76,"Os","Osmium","main",6,8,"190.00","Greek osme - smell"],
[77,"Ir","Iridium","main",6,9,"192.00","Greek iris - rainbow"],
[78,"Pt","Platinum","main",6,10,"195.00","Spanish platina - little silver"],
[79,"Au","Gold","main",6,11,"197.00","Latin aurum"],
[80,"Hg","Mercury","main",6,12,"200.5","Latin hydrargyrum - liquid silver; named after the god Mercury"],
[81,"Tl","Thallium","main",6,13,"204.5","Greek thallos - a green shoot / twig"],
[82,"Pb","Lead","main",6,14,"207.00","Latin plumbum"],
[83,"Bi","Bismuth","main",6,15,"209.00","German weisse masse or Wismuth"],
[84,"Po","Polonium","main",6,16,"[209]","Named after Poland, by discoverer Marie Curie"],
[85,"At","Astatine","main",6,17,"[210]","Greek astatos - unstable"],
[86,"Rn","Radon","main",6,18,"[222]","Derived from radium, which it comes from"],
[87,"Fr","Francium","main",7,1,"[223]","Named after France"],
[88,"Ra","Radium","main",7,2,"[226]","Latin radius - ray"],
[89,"Ac","Actinium","main",7,3,"[227]","Greek aktis / aktinos - ray / beam"],
[90,"Th","Thorium","act",7,null,"232.00","Named after Thor, the Norse god of thunder"],
[91,"Pa","Protactinium","act",7,null,"231.00","Greek protos + actinium - parent of actinium"],
[92,"U","Uranium","act",7,null,"238.00","Named after the planet Uranus"],
[93,"Np","Neptunium","act",7,null,"[237]","Named after the planet Neptune"],
[94,"Pu","Plutonium","act",7,null,"[244]","Named after the dwarf planet Pluto"],
[95,"Am","Americium","act",7,null,"[243]","Named after America"],
[96,"Cm","Curium","act",7,null,"[247]","Named after scientists Marie and Pierre Curie"],
[97,"Bk","Berkelium","act",7,null,"[247]","Named after Berkeley, California, USA"],
[98,"Cf","Californium","act",7,null,"[251]","Named after the state of California, USA"],
[99,"Es","Einsteinium","act",7,null,"[252]","Named after scientist Albert Einstein"],
[100,"Fm","Fermium","act",7,null,"[257]","Named after scientist Enrico Fermi"],
[101,"Md","Mendelevium","act",7,null,"[258]","Named after chemist Dmitri Mendeleev"],
[102,"No","Nobelium","act",7,null,"[259]","Named after scientist Alfred Nobel"],
[103,"Lr","Lawrencium","act",7,null,"[266]","Named after physicist Ernest Lawrence"],
[104,"Rf","Rutherfordium","main",7,4,"[267]","Named after physicist Ernest Rutherford"],
[105,"Db","Dubnium","main",7,5,"[268]","Named after Dubna, Russia"],
[106,"Sg","Seaborgium","main",7,6,"[269]","Named after chemist Glenn T. Seaborg"],
[107,"Bh","Bohrium","main",7,7,"[270]","Named after physicist Niels Bohr"],
[108,"Hs","Hassium","main",7,8,"[269]","Latin Hassia - the Latin name for Hesse, Germany"],
[109,"Mt","Meitnerium","main",7,9,"[278]","Named after physicist Lise Meitner"],
[110,"Ds","Darmstadtium","main",7,10,"[281]","Named after Darmstadt, Germany"],
[111,"Rg","Roentgenium","main",7,11,"[282]","Named after physicist Wilhelm Rontgen"],
[112,"Cn","Copernicium","main",7,12,"[285]","Named after astronomer Nicolaus Copernicus"],
[113,"Nh","Nihonium","main",7,13,"[286]","Nihon - Japanese name for Japan"],
[114,"Fl","Flerovium","main",7,14,"[289]","Named after physicist Georgy Flerov"],
[115,"Mc","Moscovium","main",7,15,"[290]","Named after Moscow, Russia"],
[116,"Lv","Livermorium","main",7,16,"[293]","Named after Livermore, California, USA"],
[117,"Ts","Tennessine","main",7,17,"[294]","Named after the state of Tennessee, USA"],
[118,"Og","Oganesson","main",7,18,"[294]","Named after physicist Yuri Oganessian"],
];

const HIGHLIGHT = new Set(["H","He","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar",
  "K","Ca","Cr","Mn","Fe","Co","Ni","Cu","Zn","Br","Ag","Sn","I","Ba",
  "Pt","Au","Hg","Pb","U"]);

const grid = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");

for (let g = 1; g <= 18; g++) {
  const h = document.createElement("div");
  h.className = "gnum";
  h.style.gridColumn = g + 1;
  h.style.gridRow = 1;
  h.textContent = g;
  grid.appendChild(h);
}
const grpLabel = document.createElement("div");
grpLabel.className = "rowlabel";
grpLabel.style.gridColumn = 1;
grpLabel.style.gridRow = 1;
grpLabel.textContent = "Grp";
grid.appendChild(grpLabel);

for (let p = 1; p <= 7; p++) {
  const h = document.createElement("div");
  h.className = "rowlabel";
  h.style.gridColumn = 1;
  h.style.gridRow = p + 1;
  h.textContent = p;
  grid.appendChild(h);
}
const lanLabel = document.createElement("div");
lanLabel.className = "rowlabel";
lanLabel.style.gridColumn = 1;
lanLabel.style.gridRow = 10;
lanLabel.textContent = "57-71";
grid.appendChild(lanLabel);
const actLabel = document.createElement("div");
actLabel.className = "rowlabel";
actLabel.style.gridColumn = 1;
actLabel.style.gridRow = 11;
actLabel.textContent = "89-103";
grid.appendChild(actLabel);

let lanCount = 0, actCount = 0;
ELEMENTS.forEach(function(el) {
  const [z, sym, name, cat, period, group, mass, origin] = el;
  const btn = document.createElement("button");
  const hi = HIGHLIGHT.has(sym);
  btn.className = "cell" + (hi ? " hi" : "");
  btn.setAttribute("aria-label", name + ", element " + z);
  btn.innerHTML = '<span class="z">' + z + '</span><span class="sym">' + sym + '</span><span class="mass">' + mass + '</span>';

  let col, row;
  if (cat === "main") {
    col = group + 1;
    row = period + 1;
  } else if (cat === "lan") {
    col = lanCount + 4 + 1;
    row = 10;
    lanCount++;
  } else {
    col = actCount + 4 + 1;
    row = 11;
    actCount++;
  }
  btn.style.gridColumn = col;
  btn.style.gridRow = row;

  btn.addEventListener("click", function(e) {
    openDetail(el, hi, btn.getBoundingClientRect());
  });
  grid.appendChild(btn);
});

function openDetail(el, hi, rect) {
  const [z, sym, name, cat, period, group, mass, origin] = el;
  document.getElementById("detail-z").textContent = z;
  document.getElementById("detail-symbol").textContent = sym;
  document.getElementById("detail-name").textContent = name;
  document.getElementById("detail-mass").textContent = mass;
  document.getElementById("detail-period").textContent = period;
  document.getElementById("detail-group").textContent = group ? group : (cat === "lan" ? "Lanthanide series" : "Actinide series");
  document.getElementById("detail-origin").textContent = origin;

  const badge = document.getElementById("detail-badge");
  badge.style.display = hi ? "inline-block" : "none";

  const band = document.getElementById("cardBand");
  band.className = "card-band" + (hi ? " hi" : "");

  const originX = ((rect.left + rect.width / 2) / window.innerWidth) * 100;
  const originY = ((rect.top + rect.height / 2) / window.innerHeight) * 100;
  card.style.transformOrigin = originX + "% " + originY + "%";

  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  closeBtn.focus();
}

function closeDetail() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}

const closeBtn = document.getElementById("closeBtn");
closeBtn.addEventListener("click", closeDetail);
overlay.addEventListener("click", function(e) {
  if (e.target === overlay) closeDetail();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeDetail();
});
</script>
</body>
</html>
